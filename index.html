
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate your age easily with our free online tool">
    <title>Age Calculator - Calculate Your Age</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico">
    <!-- Bootstrap CSS (latest version) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Main section for age calculation -->
    <section id="age-calculator-section" class="bg-light min-vh-100 d-flex justify-content-center align-items-center">
        <div class="container text-center">
            <h1 class="h3">Age Calculator</h1>

            <form id="age-form" class="d-flex flex-column align-items-center gap-3" method="post" action="#">
                <div class="col-md-6 col-lg-4">
                    <label for="birth-date" class="form-label">Enter your date of birth:</label>
                    <input id="birth-date" name="birth-date" class="form-control birth-date-input" type="date" required aria-describedby="birth-date-error">
                    <div id="birth-date-error" class="text-danger mt-1" role="alert"></div>
                </div>

                <button class="btn btn-dark btn-lg rounded-pill mt-3" type="submit" id="calculate-btn">Calculate Age</button>
                <div id="age-result" class="mt-3" role="status"></div>
            </form>
        </div>
    </section>

    <!-- Custom JavaScript -->
    <script defer src="index.js"></script>
</body>
</html>
